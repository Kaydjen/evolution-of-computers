<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="900" height="150" role="img" aria-label="Evolution of Computers. HTML, CSS, JavaScript.">
  <style>
    .t { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-anchor: middle; }
    /* the accent dot drifts slowly from the first dot to the last (about 7 px/s), fades in and out at the ends, never reverses; the loop starts in the middle */
    .hop { animation: hop 100s linear -50s infinite; }
    @keyframes hop {
      0% { transform: translateX(0); opacity: 0; }
      8% { opacity: 0.7; }
      92% { opacity: 0.7; }
      100% { transform: translateX(680px); opacity: 0; }
    }
  </style>
  <defs>
    <linearGradient id="tail" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#e07a1f" stop-opacity="0"/>
      <stop offset="1" stop-color="#e07a1f"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#8795a3" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#8795a3"/>
      <stop offset="0.85" stop-color="#8795a3"/>
      <stop offset="1" stop-color="#8795a3" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="149" rx="10" fill="#ffffff" stroke="#8795a3"/>
  <text class="t" x="450" y="66" font-size="38" font-weight="700" fill="#2b3a4a">Evolution of Computers</text>
  <text class="t" x="450" y="94" font-size="15" letter-spacing="1.5" fill="#8795a3">HTML · CSS · JavaScript</text>
  <rect x="40" y="121" width="820" height="2" fill="url(#fade)"/>
  <g fill="#8795a3" fill-opacity="0.55"><circle cx="110.0" cy="122" r="3"/><circle cx="137.2" cy="122" r="3"/><circle cx="164.4" cy="122" r="3"/><circle cx="191.6" cy="122" r="3"/><circle cx="218.8" cy="122" r="3"/><circle cx="246.0" cy="122" r="3"/><circle cx="273.2" cy="122" r="3"/><circle cx="300.4" cy="122" r="3"/><circle cx="327.6" cy="122" r="3"/><circle cx="354.8" cy="122" r="3"/><circle cx="382.0" cy="122" r="3"/><circle cx="409.2" cy="122" r="3"/><circle cx="436.4" cy="122" r="3"/><circle cx="463.6" cy="122" r="3"/><circle cx="490.8" cy="122" r="3"/><circle cx="518.0" cy="122" r="3"/><circle cx="545.2" cy="122" r="3"/><circle cx="572.4" cy="122" r="3"/><circle cx="599.6" cy="122" r="3"/><circle cx="626.8" cy="122" r="3"/><circle cx="654.0" cy="122" r="3"/><circle cx="681.2" cy="122" r="3"/><circle cx="708.4" cy="122" r="3"/><circle cx="735.6" cy="122" r="3"/><circle cx="762.8" cy="122" r="3"/><circle cx="790.0" cy="122" r="3"/></g>
  <g class="hop">
    <rect x="36" y="121" width="70" height="2" fill="url(#tail)"/>
    <circle cx="110" cy="122" r="4" fill="#e07a1f"/>
  </g>
</svg>
