<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 172 44" width="172" height="44" role="img" aria-label="by Kaydjen">
  <style>
    .t { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.6); } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
  </style>
  <rect x="0.5" y="0.5" width="171" height="43" rx="21.5" fill="#ffffff" stroke="#8795a3"/>
  <circle class="pulse" cx="34" cy="22" r="4" fill="#e07a1f"/>
  <text class="t" x="52" y="27.5" font-size="16" fill="#8795a3">by <tspan font-size="18" font-weight="700" fill="#2b3a4a" letter-spacing="0.3">Kaydjen</tspan></text>
</svg>
