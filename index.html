<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evolution of computers</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='5' fill='%23e07a1f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="track">
  <div id="line"></div>
  <div id="trail"></div>
  <button id="back" class="arrow" aria-label="Previous" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5l-6 7 6 7"/></svg>
  </button>
  <button id="fwd" class="arrow" aria-label="Next">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5l6 7-6 7"/></svg>
  </button>
</div>
<nav id="dots" aria-label="Cards"></nav>
<button id="credits-btn" type="button" aria-haspopup="dialog" aria-expanded="false">Credits</button>
<div id="credits" hidden></div>
<div id="lang" role="group" aria-label="Język / Language"><button type="button" data-lang="pl" lang="pl" aria-label="Polski">PL</button><span aria-hidden="true">|</span><button type="button" data-lang="en" lang="en" aria-label="English">EN</button></div>
<script src="js/cards-data.js"></script>
<script src="js/media.js"></script>
<script src="js/i18n.js"></script>
<script src="js/credits-data.js"></script>
<script src="js/cards.js"></script>
<script src="js/timeline.js"></script>
<script src="js/credits.js"></script>
</body>
</html>
